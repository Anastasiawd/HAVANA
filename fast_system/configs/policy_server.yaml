# Havana policy server config (fast process)
# Consumed by fast_system/scripts/run_pipeline.py

# --- High-level behaviour ---------------------------------------------------
instruction: ""                    # set dynamically via R2R episode instruction
obs_history_len: 32                # ring buffer capacity (RGB frames)
slow_replan_interval: 12
slow_min_obs: 5                    # need >= this many frames before first replan (matches 5 cond frames)
slow_input_frames: 5               # fixed Reason1 RGB condition frames
target_fps: 10.0                    # matches Cosmos training FPS
fast_sleep_time: 0.0               # no sleep needed when waypoints inference is fast
device: cuda
seed: 0
log_level: INFO

# --- Fast (PlanEncoder + RGB Stage-2) -------------------------------------
fast:
  config_path: /home/csevolunt/dongzhih/HAVANA/fast_system/configs/plan_stage2.yaml
  checkpoint: /home/csevolunt/dongzhih/HAVANA/fast_system/checkpoints/plan_stage2_single_rgbd_time_strat3/last.pt
  cfm_steps: 8                      # Euler integration steps for CFM trajectory sampling
  num_trajectory_samples: 1         # reduced from 4 for speed
  use_amp: true
  observation_fps: 30.0             # simulator observations per second; used for plan time

# --- Slow (talks to slow_server.py over multiprocessing.connection) -------
slow:
  enabled: true
  remote_address: /tmp/havana-slow.sock   # match slow_server.py --serve
  remote_authkey: havana-slow             # match slow_server.py --authkey
  connect_timeout: 120.0                   # seconds to wait for slow server up (7B model load)
  seed: 0

# --- Trajectory -> Habitat action ----------------------------------------
adapter:
  turn_threshold_rad: 0.1745        # ~10 deg
  forward_threshold_m: 0.01          # 1cm+ forward displacement triggers move_forward
  stop_threshold_m: 0.05             # below this & aligned -> stop
  lookahead_index: 4

# --- Debug visualisation -------------------------------------------------
debug:
  enabled: true                      # write side-by-side debug mp4
  output_dir: /home/csevolunt/dongzhih/HAVANA/havana_debug
  fps: 10.0                          # output frame rate
  queue_size: 64                     # snapshot queue depth (overflow drops oldest)
  save_slow_video: false
