defaults:
  - _self_

seed: 0
device: cuda

vjepa2:
  repo: /home/csevolunt/dongzhih/vjepa2
  checkpoint: /home/csevolunt/dongzhih/HAVANA/fast_system/model_weights/vjepa2_1_vitl_dist_vitG_384.pt
  model_name: vjepa2_1_vit_large_384
  checkpoint_key: ema_encoder
  image_size: 256
  num_frames: 16
  patch_size: 16
  tubelet_size: 2
  resize: true
  normalize: true
  input_range: auto
  freeze: true
  strict: false
  output_3d: true

route_qformer:
  input_dim: 1024
  hidden_dim: 384
  num_queries: 16
  num_layers: 3
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.1
  use_self_attention: true

temporal_transformer:
  hidden_dim: ${route_qformer.hidden_dim}
  num_queries: ${route_qformer.num_queries}
  max_clips: 64
  num_layers: 4
  num_heads: 6
  pool_heads: 6
  mlp_ratio: 4.0
  dropout: 0.1
  norm_first: true

attention_pool:
  hidden_dim: ${route_qformer.hidden_dim}
  num_heads: 6
  dropout: 0.1

vib:
  input_dim: ${route_qformer.hidden_dim}
  z_dim: 128
  beta: 0.001
  min_logvar: -10.0
  max_logvar: 10.0

stage1_head:
  z_dim: ${vib.z_dim}
  hidden_dim: 256
  num_anchors: 4
  num_turn_classes: 3
  dropout: 0.1

scand_data:
  train_index: /home/csevolunt/dongzhih/HAVANA/fast_system/data_preparation/mix_stage1_train_index.jsonl
  val_index: /home/csevolunt/dongzhih/HAVANA/fast_system/data_preparation/mix_stage1_val_index.jsonl
  image_size: ${vjepa2.image_size}
  frame_tolerance_ns: 250000000
  dtype: float32
  cache_readers: true
  max_samples: null

data:
  latents_root: /home/csevolunt/dongzhih/HAVANA/fast_system/data_preparation/recon_latents
  feature_key: feature
  pattern: clip_*.pt
  recursive: true
  split: train
  split_by: video
  val_ratio: 0.1
  test_ratio: 0.0
  seed: ${seed}
  max_samples: null
  dtype: float32
  load_metadata: true
  cache_in_memory: false

  # Optional supervised manifests generated by data_preparation/prepare_recon.py.
  # If provided, the dataset uses manifest records and loads each record's latent_path.
  train_manifest: null
  val_manifest: null
  test_manifest: null
  manifest_path: null

dataloader:
  batch_size: 128
  shuffle: True
  num_workers: 1
  pin_memory: true
  persistent_workers: false
  drop_last: false
  flatten_tokens: false
  timeout: 120

training:
  output_dir: /home/csevolunt/dongzhih/HAVANA/fast_system/checkpoints/stage1
  epochs: 50
  lr: 0.0001
  weight_decay: 0.05
  beta_kl: 0.001
  amp: true
  grad_clip: 1.0
  grad_accum_steps: 4
  log_interval: 20
  progress: true
  tensorboard: true
  tensorboard_dir: ${training.output_dir}/tb
