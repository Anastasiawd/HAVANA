# Data loading configuration
#
# obs_dir and goal_dir each contain a folder of images.
# Images are sorted by the trailing number in the filename
# and paired 1:1 by index:  obs[0]↔goal[0], obs[1]↔goal[1], ...

# --- Observation folder ---
obs_dir: ${oc.env:HOME}/ffnav/visualnav-transformer/obs/00

# --- Goal folder ---
goal_dir: ${oc.env:HOME}/ffnav/visualnav-transformer/videos/Robot_Exits_Bedroom_Into_Hallway

# Image extensions to consider
image_extensions:
  - .jpg
  - .jpeg
  - .png
